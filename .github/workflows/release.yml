name: Release

# Push a tag like v0.1.0 to build both signed APKs (HorizOn and HorizOn+) and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HORIZON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret HORIZON_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APKs
        env:
          HORIZON_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.HORIZON_KEYSTORE_PASSWORD }}
          HORIZON_KEY_ALIAS: ${{ secrets.HORIZON_KEY_ALIAS }}
          HORIZON_KEY_PASSWORD: ${{ secrets.HORIZON_KEY_PASSWORD }}
        # Unit tests only exist for the debug variants (AGP default); they cover the same code.
        run: ./gradlew testOfflineDebugUnitTest testOnlineDebugUnitTest assembleOfflineRelease assembleOnlineRelease

      # Two builds: HorizOn (no internet) and HorizOn+ (adds internet for lyrics).
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OFFLINE="HorizOn-$GITHUB_REF_NAME.apk"
          ONLINE="HorizOnPlus-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/offline/release/app-offline-release.apk "$OFFLINE"
          cp app/build/outputs/apk/online/release/app-online-release.apk "$ONLINE"
          cat > notes.md <<'EOF'
          Two builds, pick one (installing one over the other keeps your settings):

          - **HorizOn-…apk**: no internet permission. The lyrics screen shows a visualizer.
          - **HorizOnPlus-…apk** (HorizOn+): adds internet, used only to look up time-synced lyrics on lrclib.net once you turn Lyrics on.

          EOF
          gh release create "$GITHUB_REF_NAME" "$OFFLINE" "$ONLINE" --title "HorizOn $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
