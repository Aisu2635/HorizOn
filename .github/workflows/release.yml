name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HORIZON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret HORIZON_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          HORIZON_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.HORIZON_KEYSTORE_PASSWORD }}
          HORIZON_KEY_ALIAS: ${{ secrets.HORIZON_KEY_ALIAS }}
          HORIZON_KEY_PASSWORD: ${{ secrets.HORIZON_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="HorizOn-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "HorizOn $GITHUB_REF_NAME" --generate-notes
