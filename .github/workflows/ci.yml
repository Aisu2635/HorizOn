name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Both builds: offline (HorizOn) and online (HorizOn+, lyrics).
      - name: Lint and unit tests
        run: ./gradlew lintOfflineDebug lintOnlineDebug testOfflineDebugUnitTest testOnlineDebugUnitTest
      - name: Build debug APKs
        run: ./gradlew assembleOfflineDebug assembleOnlineDebug
      - uses: actions/upload-artifact@v7
        with:
          name: horizon-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
